 e_we_frontier_wilderness:0 "The Unsettled Lands"
 e_we_frontier_wilderness_adj:0 "Frontier"
 k_we_frontier_marches:0 "The Unsettled Marches"
 we_frontier.1.a:0 "Send guards and provisions."
 we_frontier.1.b:0 "They must advance cautiously."
 we_frontier.1.desc:0 "The settlers of [scope:we_frontier_target.GetNameNoTier] have found old trails beneath the undergrowth. Local guides warn that beasts and raiders use them too. Extra guards and supplies would let the next families settle safely; otherwise, the camp must grow more cautiously."
 we_frontier.1.t:0 "Beyond the Palisade"
 we_frontier.2.a:0 "Keep the supplies moving."
 we_frontier.2.b:0 "Withdraw the settlers and abandon this project."
 we_frontier.2.desc:0 "Messengers bring the latest account from [scope:we_frontier_target.GetNameNoTier].\n\nWork in the current phase is #bold [scope:we_frontier_target.MakeScope.Var('we_frontier_progress').GetValue|0] / 100#! complete. Surveying is followed by the outpost phase; each must reach 100. Supplies cost #bold 6 gold every 90 days#!. Eight unpaid quarters will force withdrawal.\n\nA developing outpost can be seized in a Frontier War. Its new holder inherits both progress and the supply bill."
 we_frontier.2.t:0 "The Frontier Ledger"
 we_frontier_abandon_decision:0 "Manage Frontier Settlement"
 we_frontier_abandon_decision_confirm:0 "Open the frontier ledger"
 we_frontier_abandon_decision_desc:0 "Inspect an unfinished expedition or outpost, check its progress and supply obligations, or withdraw support. Abandonment returns the county to wilderness and loses the investment; it is unavailable during war."
 we_frontier_abandon_decision_tooltip:0 "View progress and manage your frontier project."
 we_frontier_custodian:0 "Wilderness Custodian"
 we_frontier_custodian_desc:0 "An engine custodian for unsettled land, rather than a playable ruler."
 we_frontier_custodian_name:0 "The Wilderness"
 we_frontier_expedition:0 "Settlement Expedition"
 we_frontier_expedition_decision:0 "Fund a Frontier Expedition"
 we_frontier_expedition_decision_confirm:0 "Send the expedition"
 we_frontier_expedition_decision_desc:0 "Beyond the borders lie lands that might sustain a new settlement. Choose a reachable wilderness county, fund an expedition, then support its outpost until it becomes a normal county.\n\nInitial funding: #bold 150 gold#!. Supplies: #bold 6 gold every 90 days#! during both phases. One unfinished project at a time. An expedition takes roughly 2–3 years, followed by 7–10 years of outpost development. AI expansion is slower and more cautious. Inherited projects follow their sponsoring title."
 we_frontier_expedition_decision_tooltip:0 "Choose neighbouring land or wilderness reachable across coastal waters."
 we_frontier_expedition_desc:0 "Surveyors and guards prepare a new frontier settlement. The sponsor pays 6 gold every 90 days. Typical duration: 2–3 years; AI expeditions progress more slowly."
 we_frontier_new_settlement:0 "Newly Established Settlement"
 we_frontier_new_settlement_desc:0 "The outpost is now a normal holding, although its tax and levy base needs another decade to mature."
 we_frontier_outpost:0 "Developing Outpost"
 we_frontier_outpost_01:0 "Palisade and Supply Camp"
 we_frontier_outpost_01_desc:0 "A small garrison guards the first settlers. Regular supplies will turn this fragile camp into a lasting settlement."
 we_frontier_outpost_desc:0 "A frontier outpost grows under its sponsor. Supplies cost 6 gold every 90 days. Establishment normally takes 7–10 years, modified mildly by terrain and racial suitability. Occupation pauses progress. Rivals can contest this county through a Frontier War."
 we_frontier_outpost_founded:0 "A Frontier Outpost Is Founded"
 we_frontier_progress_value:0 "Phase progress: [Title.MakeScope.Var('we_frontier_progress').GetValue|0] / 100"
 we_frontier_settlement_complete:0 "The Frontier Takes Root"
 we_frontier_supply_shortage:0 "Frontier Supply Shortage"
 we_frontier_supply_shortage_desc:0 "The sponsor cannot afford the next 6-gold supply payment. Progress is paused; eight consecutive unpaid quarters cause the project to be abandoned."
 we_frontier_war_defeat_desc:0 "The defender keeps the outpost and the attacker loses prestige."
 we_frontier_war_invalidated_desc:0 "The target has ceased to be a contested outpost."
 we_frontier_war_victory_desc:0 "The attacker receives the disputed outpost and its supply obligation. Most settlement progress survives, with ten points lost to the fighting."
 we_frontier_war_white_peace_desc:0 "The outpost remains with its present sponsor."
 we_frontier_wilderness_01:0 "Unsettled Country"
 we_frontier_wilderness_01_desc:0 "No lord draws taxes from this country. Trails, ruins and local communities await a funded expedition."
 we_outpost_holding:0 "Frontier Outpost"
 we_wilderness_government:0 "Unsettled Wilderness"
 we_wilderness_government_adjective:0 "Unsettled"
 we_wilderness_government_desc:0 "Frontier country beyond the settled realms. Expeditions can establish outposts here; ordinary conquest cannot take it."
 we_wilderness_holding:0 "Wilderness"
