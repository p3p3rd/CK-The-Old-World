l_english:
 we_fixed_model_designer_title:0 "Your campaign appearance"
 we_fixed_model_designer_note:0 "Warhammer uses preset character models. The vanilla preview is hidden because it does not show your in-game appearance. Choose your culture, species and appearance traits; your model appears after starting the campaign. Atelier hair and beard options affect supported models. Ordinary face and body sliders do not reshape a preset model."
