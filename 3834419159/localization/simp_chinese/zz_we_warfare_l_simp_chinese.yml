l_simp_chinese:
 we_maa_war_bear_riders:0 "War Bear Riders"
 we_maa_war_bear_riders_flavor:0 "Urged onward by riders sworn to Ursun, these war bears crash through spear lines and keep their footing in snow that would break a charge of horses."
 we_maa_war_sleds:0 "War Sleds"
 we_maa_war_sleds_flavor:0 "Bear-drawn sleds carry Kislevite gunners across the frozen steppe. Their runners slide easily on packed snow and bog down badly in mud."
 we_maa_streltsi:0 "Streltsi"
 we_maa_streltsi_flavor:0 "The Streltsi rest their heavy guns on broad axe heads. When the enemy closes, they turn the same axes on the survivors of their volley."
 we_maa_ice_guard:0 "Ice Guard"
 we_maa_ice_guard_flavor:0 "The Ice Court’s guard looses frost-touched arrows before meeting attackers with blades that carry the bite of winter."
 we_maa_empire_halberdiers:0 "Imperial Halberdiers"
 we_maa_empire_halberdiers_flavor:0 "In the service of their Elector, these State Troops drill until an entire rank can lower its halberds as one."
 we_maa_empire_handgunners:0 "Imperial Handgunners"
 we_maa_empire_handgunners_flavor:0 "Imperial handgunners trust measured volleys and stout powder. Given a clear field, they can open gaps in even a well-armoured line."
 we_maa_demigryph_knights:0 "Demigryph Knights"
 we_maa_demigryph_knights_flavor:0 "The knight’s lance breaks the first rank. The demigryph’s beak and claws do the rest, tearing into opponents that would turn an ordinary horse."
 we_maa_knights_of_realm:0 "Knights of the Realm"
 we_maa_knights_of_realm_flavor:0 "The knights who hold Bretonnia’s fiefs answer their dukes with lance and shield, gathering their banners before the charge."
 we_maa_peasant_bowmen:0 "Bretonnian Bowmen"
 we_maa_peasant_bowmen_flavor:0 "Called from the villages of Bretonnia, these bowmen set their stakes before loosing at anything their lords have yet to ride down."
 we_maa_grail_reliquae:0 "Battle Pilgrims"
 we_maa_grail_reliquae_flavor:0 "Battle Pilgrims bear the relics of a fallen Grail Knight into the press of battle, defending their sacred burden with fierce devotion."
 we_maa_jade_warriors:0 "Jade Warrior Halberds"
 we_maa_jade_warriors_flavor:0 "Cathay’s Jade Warriors hold their halberds in disciplined ranks, buying time for the volleys behind them."
 we_maa_crane_gunners:0 "Crane Gunners"
 we_maa_crane_gunners_flavor:0 "A crane gun is too unwieldy to serve alone. One soldier steadies the long barrel while the other sights the shot that can bring down an officer or a beast."
 we_maa_celestial_guard:0 "Celestial Dragon Guard"
 we_maa_celestial_guard_flavor:0 "The Celestial Dragon Guard carry the finest arms of Cathay. Their duty is to hold the line wherever the Dragon Emperor’s banners are raised."
 we_maa_dwarf_thunderers:0 "Dwarf Thunderers"
 we_maa_dwarf_thunderers_flavor:0 "The Thunderers keep their powder dry and their firing lanes clear. Their guns answer challenges that no Dwarf would leave unanswered."
 we_maa_dwarf_ironbreakers:0 "Ironbreakers"
 we_maa_dwarf_ironbreakers_flavor:0 "Clad in rune-worked gromril, Ironbreakers hold the deepest passages of the karaks against whatever claws its way up from below."
 we_maa_dwarf_slayers:0 "Slayers"
 we_maa_dwarf_slayers_flavor:0 "A Slayer can settle the debt of shame only by seeking a worthy death. Giants and trolls give these axe-wielders the chance they crave."
 we_maa_infernal_guard:0 "Infernal Guard"
 we_maa_infernal_guard_flavor:0 "Masked warriors of Zharr hold their ground under an oath of punishment, their dark armour tested against the horrors of the wastes."
 we_maa_lothern_sea_guard:0 "Lothern Sea Guard"
 we_maa_lothern_sea_guard_flavor:0 "Lothern’s sailors drill with bow and spear. They can meet a boarding party or a charge ashore with the same ordered ranks."
 we_maa_hoeth_swordmasters:0 "Swordmasters of Hoeth"
 we_maa_hoeth_swordmasters_flavor:0 "Years of study at the White Tower of Hoeth teach these warriors to place a greatsword’s edge with the precision of a duellist."
 we_maa_silver_helms:0 "Silver Helms"
 we_maa_silver_helms_flavor:0 "Young nobles of Ulthuan ride beneath polished helms, proving their houses’ courage with swift, well-ordered charges."
 we_maa_waywatchers:0 "Waywatchers"
 we_maa_waywatchers_flavor:0 "On the paths of Athel Loren, these wardens can follow an intruder for days before a single arrow betrays their presence."
 we_maa_wild_riders:0 "Wild Riders"
 we_maa_wild_riders_flavor:0 "Orion’s hunt rides wherever the forest paths open. Its riders burst from the trees and vanish before a slower foe can turn."
 we_maa_dryad_glade:0 "Dryad Grove Guard"
 we_maa_dryad_glade_flavor:0 "Dryads rise among the roots when a sacred grove is threatened. Their claws and bark-hard limbs are deadliest beneath the canopy."
 we_maa_darkshards:0 "Darkshards"
 we_maa_darkshards_flavor:0 "Ranks of Druchii crossbowmen send bolts downrange in quick succession, harrying any formation that leaves its flank exposed."
 we_maa_black_guard:0 "Black Guard of Naggarond"
 we_maa_black_guard_flavor:0 "Naggarond’s Black Guard are drilled in merciless obedience. Their halberds protect the Witch King’s banner amid the thickest fighting."
 we_maa_cold_one_knights:0 "Cold One Knights"
 we_maa_cold_one_knights_flavor:0 "The nobility of Naggaroth go to war astride spiteful Cold Ones. Once loosed into the enemy ranks, the beasts are scarcely less dangerous than their riders."
 we_maa_black_orcs:0 "Black Orcs"
 we_maa_black_orcs_flavor:0 "Black Orcs carry enough iron to change weapons in the middle of a fight. Other greenskins give their marching ranks a wide berth."
 we_maa_goblin_wolf_riders:0 "Goblin Wolf Riders"
 we_maa_goblin_wolf_riders_flavor:0 "Riding lean wolves, Goblin raiders loose arrows at the edges of the fight and run down anyone who breaks away from the line."
 we_maa_night_goblin_fanatics:0 "Night Goblin Fanatics"
 we_maa_night_goblin_fanatics_flavor:0 "Once loosed, a Fanatic whirls a massive iron ball through friend and foe alike. Close country lets the mob conceal its most dangerous members."
 we_maa_stormvermin:0 "Stormvermin"
 we_maa_stormvermin_flavor:0 "The largest and best-equipped Skaven are set in ordered ranks, where a wall of halberds helps keep their courage from slipping."
 we_maa_warplock_jezzails:0 "Warplock Jezzails"
 we_maa_warplock_jezzails_flavor:0 "Skryre teams brace their long warplock rifles behind pavises and take shots that can punch through plate or bring down a flying beast."
 we_maa_gutter_runners:0 "Gutter Runners"
 we_maa_gutter_runners_flavor:0 "Clan Eshin’s runners dart through broken ground, cutting down isolated soldiers before the foe can bring a formation to bear."
 we_maa_saurus_guard:0 "Temple Guard"
 we_maa_saurus_guard_flavor:0 "Temple Guard protect the Slann with heavy blades and shields, holding the approaches to their temple-cities with tireless discipline."
 we_maa_chameleon_skinks:0 "Chameleon Skinks"
 we_maa_chameleon_skinks_flavor:0 "Chameleon Skinks blend into the undergrowth. A volley of poisoned darts is often the only warning their prey receives."
 we_maa_terradon_riders:0 "Terradon Riders"
 we_maa_terradon_riders_flavor:0 "Skinks on Terradons skim the canopy and drop rocks into exposed ranks before flying out of reach."
 we_maa_ironguts:0 "Ironguts"
 we_maa_ironguts_flavor:0 "Ironguts wear armour prized by their tribes and swing weapons built to crush shields, riders and the horses beneath them."
 we_maa_leadbelchers:0 "Leadbelchers"
 we_maa_leadbelchers_flavor:0 "A Leadbelcher carries a cannon as readily as another Ogre carries a club. The barrel is useful at close quarters even after the powder has gone."
 we_maa_tomb_guard:0 "Tomb Guard"
 we_maa_tomb_guard_flavor:0 "The chosen warriors of Nehekhara wake from their tombs to defend their king, bearing bronze blades and an unbroken memory of their drill."
 we_maa_tomb_chariots:0 "Skeletal Chariots"
 we_maa_tomb_chariots_flavor:0 "The skeletal steeds of Nehekhara draw light chariots in sweeping lines across the sands, scattering ranks too slow to make way."
 we_maa_deck_gunners:0 "Deck Gunners"
 we_maa_deck_gunners_flavor:0 "The Vampire Coast’s dead gunners bring heavy firearms ashore, seeking the clear sight lines and damp air they knew in life."
 we_maa_grave_guard:0 "Grave Guard"
 we_maa_grave_guard_flavor:0 "Interred with the arms of their old lord’s household, these dead retain the discipline that living soldiers struggle to maintain."
 we_maa_marauder_champions:0 "Marauder Champions"
 we_maa_marauder_champions_flavor:0 "Norsca’s seasoned raiders fight behind weathered shields, waiting for the moment to break the enemy’s line with their axes."
 we_maa_norscan_hunters:0 "Marauder Hunters"
 we_maa_norscan_hunters_flavor:0 "Hardened by long hunts in the northern wilds, these marauders fight with javelins and axes and know how to keep moving in deep snow."
 we_maa_bestigors:0 "Bestigor Herd"
 we_maa_bestigors_flavor:0 "Bestigors take the choicest armour and the heaviest axes of the herd. They favour a sudden charge from cover over a drawn-out march."
 we_maa_centigors:0 "Centigor Herd"
 we_maa_centigors_flavor:0 "Centigors gallop through woods and broken hills that would bring horsemen up short, throwing themselves into a fight with wild abandon."
 we_maa_steppe_marauders:0 "Steppe Marauder Riders"
 we_maa_steppe_marauders_flavor:0 "Mounted hunters of the northern steppe ride in loose order, drawing pursuers out of formation before turning their bows on them."
 we_maa_araby_desert_guard:0 "Desert Palace Guard"
 we_maa_araby_desert_guard_flavor:0 "The palace guard of Araby carry long spears through heat and blowing dust, holding approaches that less seasoned troops would abandon."
 we_maa_araby_wind_riders:0 "Dune Wind Riders"
 we_maa_araby_wind_riders_flavor:0 "Dune Wind Riders guide their mounts by stars and landmarks. They strike across stretches of desert that enemies expect to be impassable."
 we_maa_tilean_pikes:0 "Tilean Condottieri Pikes"
 we_maa_tilean_pikes_flavor:0 "Tilean captains sell the discipline of their pike squares to those who can pay. A properly formed square can stop a knight’s charge cold."
 we_maa_tilean_pavises:0 "Tilean Pavise Crossbows"
 we_maa_tilean_pavises_flavor:0 "These mercenary crossbowmen reload behind painted pavises, well protected as long as they have room to set their shields."
 we_maa_estalian_bucklers:0 "Estalian Sword and Buckler Company"
 we_maa_estalian_bucklers_flavor:0 "Estalian sword-and-buckler companies slip beneath pikes or around shield walls, turning tight quarters into an advantage."
 we_maa_ind_war_elephants:0 "Indish Armoured Elephants"
 we_maa_ind_war_elephants_flavor:0 "Armoured elephants of Ind carry their crews across open ground and jungle trails, trampling infantry that fail to keep their nerve."
 we_maa_ind_bow_guard:0 "Indish Palace Bow Guard"
 we_maa_ind_bow_guard_flavor:0 "Bow guards sworn to the courts of Ind train to shoot through dense cover and close around the ruler’s standards when the enemy advances."
 we_maa_nippon_ashigaru:0 "Ashigaru Spear Company"
 we_maa_nippon_ashigaru_flavor:0 "Raised under the standards of Nippon’s lords, Ashigaru learn to brace their spears together and keep formation under pressure."
 we_maa_nippon_samurai:0 "Samurai Retinue"
 we_maa_nippon_samurai_flavor:0 "Samurai serve their lords with bow and blade. Their retinues make their reputation in the close fighting that decides a battle."
 we_maa_koryon_bow_guard:0 "Koryon Composite Bow Guard"
 we_maa_koryon_bow_guard_flavor:0 "The bow guards of Koryon learn to send their arrows across steep valleys, where an advancing enemy has little room to spread out."
 we_maa_khureshi_naga_guard:0 "Naga Coil Guard"
 we_maa_khureshi_naga_guard_flavor:0 "The Naga Coil Guard glide between the roots of Khuresh’s forests, striking from angles that an orderly line of foot soldiers can scarcely watch."
 we_maa_monkey_staff_guard:0 "Monkey King’s Staff Guard"
 we_maa_monkey_staff_guard_flavor:0 "The Monkey King’s staff fighters spring from root to branch and use the reach of their weapons to trip and scatter enemies in close country."
 we_maa_tiger_claw_guard:0 "Tiger Claw Guard"
 we_maa_tiger_claw_guard_flavor:0 "The Tiger Claw Guard close on their prey under cover of leaves, then strike with the speed of a hunting cat."
 we_maa_amazon_jaguar_guard:0 "Jaguar Guard"
 we_maa_amazon_jaguar_guard_flavor:0 "Jaguar Guard watch the forest trails of Lustria. They step out of cover only when a well-placed ambush can decide the fight."
 we_maa_albion_oath_guard:0 "Albion Oathguard"
 we_maa_albion_oath_guard_flavor:0 "Albion’s Oathguard fight in the rain and mist of their home, making narrow, waterlogged approaches difficult to force."
 we_maa_fimir_mist_warriors:0 "Mist Warriors"
 we_maa_fimir_mist_warriors_flavor:0 "Fimir emerge from fog and marsh water to fight at close range, where their strength tells and their enemies can scarcely see to form up."
 we_maa_gnome_wardens:0 "Gnome Lantern Wardens"
 we_maa_gnome_wardens_flavor:0 "Lantern Wardens know every hedge and hollow near their settlements, guiding neighbours to safety and drawing raiders into poor ground."
 we_maa_moot_fieldwardens:0 "Moot Fieldwardens"
 we_maa_moot_fieldwardens_flavor:0 "Fieldwardens watch the lanes and hedgerows of the Moot with their bows close at hand. They know exactly where to wait for an unwelcome visitor."
 we_maa_darklands_caravan_guard:0 "Dark Lands Caravan Guard"
 we_maa_darklands_caravan_guard_flavor:0 "Caravan guards march beside the wagons through the Dark Lands, ready to make a wall of spears when dust on the horizon turns into riders."
 we_maa_monster_hunters:0 "Monster Hunters"
 we_maa_monster_hunters_flavor:0 "Hooked spears, braced bolts and experience with quarry larger than a horse give these hunters a chance against beasts on land and in the air."
 we_maa_engine_breakers:0 "Engine Breakers"
 we_maa_engine_breakers_flavor:0 "Engine Breakers slip past the fighting to cut harnesses, foul gun carriages and wedge axes into the tracks of armoured machines."
 we_flying:0 "Flying Monsters"
 game_concept_we_flying:0 "Flying Monsters"
 game_concept_we_flying_desc:0 "Winged beasts and machines vulnerable to concentrated missile fire and specialist hunters."
