l_english:
#####Innovations#####
 innovation_grail_knights:0 "Renowed Knight Orders"
 innovation_grail_knights_desc:0 "The Knightly Orders are a heroic brotherhood of armoured warriors who ride into battle atop mighty barded warhorses and sometimes other, more exotic creatures into battle."
 innovation_war_shrines:0 "War Shrines"
 innovation_war_shrines_desc:0 "Warshrines are mighty battle-altars of the Gods, large metal palanquins that provoke the marvelous powers of the Higher Powers. The men of the north are ever conscious that their actions could catch the eye of their gods, and they do everything in their power to attract their notice."
 innovation_gunnery_schools_1:0 "Gunnery Schools"
 innovation_gunnery_schools_1_desc:0 "The Gunnery School, a sprawling network of forges, smelteries and industrial factories where veteran gunsmiths manufacture and maintain the artillery trains."
 innovation_specialized_marskman:0 "Marksmanship Schools"
 innovation_specialized_marskman_desc:0 "The Gunnery School, a sprawling network of forges, smelteries and industrial factories where veteran gunsmiths manufacture and maintain the artillery trains."
 innovation_elite_barracks:0 "State Troops"
 innovation_elite_barracks_desc:0 "The armies of the Empire are massive and diverse fighting forces, having a wide range of available units while the Imperial Navy patrols the mighty rivers of The Empire besides protecting the northern coast of Nordland."
 innovation_gunnery_schools_3:0 "Gunnery Schools"
 innovation_gunnery_schools_3_desc:0 "The Gunnery School, a sprawling network of forges, smelteries and industrial factories where veteran gunsmiths manufacture and maintain the artillery trains."
 innovation_sylvania:0 "Sylvanian Necromancy"
 innovation_sylvania_desc:0 "The Vampires of the Old World claim dominion over the mortal remains of all earthly creatures. To die is to surrender oneself to their power. The generals of the Empire claim that the night is always darkest before the dawn; The Warrior Priests of Sigmar preach that there is hope yet. But they know little of the games immortals play. Patient, cunning, devious, the Vampires work to conquer the lands of the living with ancient and corrupted sorcery."
 innovation_mercs:0 "Dogs of War"
 innovation_mercs_desc:0 "The Southern Realms are the home of most of the Dogs of War. Mercenaries operating wherever there is coin. They have a history of exploring the New World with Tilean explorers and could have been based out of Sartosa, New World Colonies and Araby on the Vortex Map."
 
 
 
 ####Bretonnia Units###
 grail_knights:0 "Grail Knights"
 grail_knights_flavor:0 "Saints amongst men, warriors beyond compare who had fought in wars beyond number, vanquished the most dreaded of foes and who had been granted powers beyond the ken of mere mortals."
 grail_guardians:0 "Grail Guardians"
 grail_guardians_flavor:0 "These men, selected from some of the very best of the Grail Knights, are warriors par excellence, striking down the enemies with shining blades of justice."
 hippo_knights:0 "Royal Hippogryph Knights"
 hippo_knights_flavor:0 "Royal Hippogryph Knights is a Bretonnia flying monstrous cavalry unit. A hippogryph is no easy prize, but its power in battle makes the effort to tame one worth it."
 pegasus_knight:0 "Pegasus Knights"
 pegasus_knight_flavor:0 "The richest and greatest Knights of the Realm ride to war atop the back of a majestic Pegasus. Most Pegasus Knights hail from around the border city of Parravon, hard on the slopes of the Grey Mountains where many of their noble mounts can be found. These creatures are difficult to capture and harder still to train, but once they are they make loyal and powerful mounts."
 
 ###Evil angry people####
 chaos_warriors:0 "Chaos Warriors"
 chaos_warriors_flavor:0 "Chaos Warriors are mortals who have left their natural way of life and chosen to dedicate themselves to a Chaos God, in order to gain their favour and blessings with the ultimate goal of daemonhood and eternal life."
 chaos_marauders:0 "Marauders of Chaos"
 chaos_marauders_flavor:0 "Chaos Marauders are the standard warriors drawn from the barbaric tribes of the Northmen who hail from the harsh lands of the north, including Norsca, the Chaos Wastes and the Endless Steppes."
 chaos_chosen:0 "Chosen Chaos Warriors"
 chaos_chosen_flavor:0 "Chaos Chosen are also known as "Slaves to Darkness" for they are those mortals most committed to the ruination of the mortal world. The Chosen are among the most favoured of the Ruinous Powers' many mortal servants, alongside the Chaos Knights."
 aspiring_champions:0 "Aspiring Champions"
 aspiring_champions_flavor:0 "Aspiring Champions are often the best any Chaos Warrior can hope to achieve, since most rarely progress further than this high position. The reason is simple. Chaos Champions eliminate anyone they see as a rival, butchering their underlings to ensure their continued place."
 chaos_knight:0 "Chaos Knights"
 chaos_knight_flavor:0 "Chaos Knights are particularly mighty Chaos Warriors clad in the thickest plate armor, and whose dreaded reputation is known throughout as one of the world's most fearsome horsemen. "
 marauder_horseman:0 "Marauder Horsemen"
 marauder_horseman_flavor:0 "Marauder Horsemen are those warriors drawn from among the barbaric tribes of the Northmen that maintain traditions of horse-riding, such as the horse nomads of the Kurgan and Hung who live among the grasslands of the Endless Steppes."
 chaos_chariot:0 "Chaos Chariots"
 chaos_chariot_flavor:0 "Chaos Chariots are more than just machines of war; they are symbols of status and power. They are drawn by a pair of huge destriers swollen to unnatural size by the corrupting magical energies of Chaos."
 
 
 ###Sexy Vampires####
 drak_templars:0 "Drakenhof Templars"
 drak_templars_flavor:0 "Another great order of Blood Knights were the infamous Drakenhof Templars. Originally founded by the counts of Sylvania the von Draks, the first vampire count of Sylvania Vlad von Carstein turned them into vampires to serve as his elite guard."
 blood_dragon:0 "Blood Dragons"
 blood_dragon_flavor:0 "The most infamous order of Blood Knights were easily the Order of the Blood Dragon. Centuries ago, the people of the Empire would have named the knights of the Order of the Blood Dragon among the noblest of warriors defending their lands."
 red_death:0 "Knights of the Red Death"
 red_death_flavor:0 "None were more bloodthirsty or more merciless than the Knights of the Red Death. These vampiric fiends were the butchers behind the Massacre of Modruin and the slaughter of every living soul in the siege of the walled town of Ostwald."
 grave_guard:0 "Grave Guard"
 grave_guard_flavor:0 "Summoned from their rest by the dark sorcery of vampires or necromancers, they are powerful warriors and upon the walls of Drakenhof Castle, and other Vampire­ haunted keeps of Sylvania, tireless warriors patrol clad in rust-gnawed armour."
 syl_crossbows:0 "Sylvanian Crossbowmen"
 syl_crossbows_flavor:0 "Ever since Vlad von Carstein revealed himself as a vampire and led his armies of the dead against the Empire, the Von Carstein Dynasty have been supported by the peasent levies of their land, fighting for them as they would for a living lord."
 syl_archers:0 "Sylvanian Archers"
 syl_archers_flavor:0 "Ever since Vlad von Carstein revealed himself as a vampire and led his armies of the dead against the Empire, the Von Carstein Dynasty have been supported by the peasent levies of their land, fighting for them as they would for a living lord."
 
 ###Imperial chads####
 empire_outriders:0 "Outriders"
 empire_outriders_flavor:0 "Outriders are the elite veterans of a Pistolkorps squadron, acting as both a drill-instructor and commander of a squadron of ill-experienced Pistoliers."
 witch_hunters:0 "Witch Hunters"
 witch_hunters_flavor:0 "Witch Hunters are grim, cold individuals who have dedicated their life to the eradication of corruption wherever it may be."
 
 ###Imperial marksman####
 empire_handgunners:0 "Handgunners"
 empire_handgunners_flavor:0 "Handgunners are one of the primary ranged units of the Imperial army. Equipped with the loud and deadly handgun, these men are highly trained as a line-formation of missle support that can penetrate even the thickest of enemy armor. As such, they are the mainstay of most Imperial missile support."
 empire_huntsmen:0 "Empire Huntsmen"
 empire_huntsmen_flavor:0 "In the untamed wilds of the Empire there lurk countless mutants who are ever hungry for human flesh. Huntsmen are masters of the wilderness and skilled trackers who patrol the forests surrounding their homes to cull these foul monsters. Armed with little more than a bow and their wits, these grim warriors are adept at luring their quarry into lethal ambushes."
 empire_crossbows:0 "Empire Crossbowman"
 empire_crossbows_flavor:0 "Crossbows are not popular weapons in the Empire, though Tilean mercenaries are often recruited to augment the firepower of an Elector Count's army. Some Counts from the southern provinces retain units of Crossbowmen as part of their personal household troops."
 
 ###Imperial Infantry""""
 empire_halberdiers:0 "Empire Halberdiers"
 empire_halberdiers_flavor:0 "Equipped with the fearsome halberd, a long-shafted weapon with a heavy blade, this weapon is capable of smashing through heavy armour and the tough hides of deadly creatures."
 empire_greatswords:0 "Empire Greatswords"
 empire_greatswords_flavor:0 "Greatswords are elite infantry troops of Imperial armies. They are the bodyguard of Elector Counts and other Empire Generals. Greatswords are named for their great swords (massive two-handed swords) and wear full plate armour."
 empire_spears:0 "Empire Spearmen"
 empire_spears_flavor:0 "Spearmen are amongst the three most common infantry types fielded by the armies of the Empire. Equipped with a spear and shield, providing the Empire with much needed holding power."
 freecompanymilitia:0 "Free Company Militia"
 freecompanymilitia_flavor:0 "Free Company Militia is a polite term that describes the Men and Woman from neighboring towns or villages that have taken up arms, willingly or not, to serve alongside the armies of the Empire and defend the lands of their birth."
 empire_swords:0 "Empire Swordsmen"
 empire_swords_flavor:0 "These daring soldiers are often romanticized by Imperial poets as tall dashing figures, often bravely engaging the best enemy regiments with only their bravery and combat skill, striking an opponent's weak spot while knowing how to defend himself with his battle-worn shield."
 
 ###WIP ARTILLERY####
 hellstorm_rocket_batteries:0 "Hellstorm Rocket Batteries"
 hellstorm_rocket_batteries_flavor:0 "Hellstorm Rocket battery are a devastating long ranged artillery piece that's maned by three crewmen."
 steam_tank:0 "Steam Tank"
 steam_tank_flavor:0 "Steam Tanks are monstrous, smoke-belching war machines that rumble towards the enemy and fire deadly cannonballs from their steam-powered guns to crush all those that stand against the empire."
 
 ##Knights##
 morr_knights:0 "Knights of Morr"
 morr_knights_flavor:0 "The Knights of Morr, also known as the Black Guards of Morr, are a Knightly Order, sworn to protecting the Empire's resting places from the undead and those who would raise the dead."
 reiklanderguard:0 "Reiksguard Knights"
 reiklanderguard_flavor:0 "The Reiksguard form an elite core of highly trained, expensively-equipped troops who are loyal to the Emperor in person, and alongside the mighty Knights of the Blazing Sun and Knights of the White Wolf, are among his best troops."
 blazingsunknight:0 "Knights of the Blazing Sun"
 blazingsunknight_flavor:0 "The Order of the Blazing Sun is currently based in Talabheim and the Knights of the Blazing Sun are arguably the greatest knights in the Empire. Favored by Myrmidia, many warriors are able to set their weapons ablaze with immolating fire."
 whitewolfknight:0 "Knights of the White Wolf"
 whitewolfknight_flavor:0 "The Knights of the White Wolf, or White Wolves as they are also commonly known, are the most infamous of all the Templar Orders under the worship and servitude of the Ar-Ulric and their God, Ulric, God of Wolves and Winter."
 pantherknight:0 "Knights Panther"
 pantherknight_flavor:0 "The Knights Panther, are a Secular Order of Knights dedicated to the wholesome eradication of mutants and Chaos worshipers alike, as well as upholding the racial integrity of the Empire as a whole."
 demi_knight:0 "Demigryph Knights"
 demi_knight_flavor:0 "Demigryph Knights are amongst the most powerful heavily armored shock cavalry ever fielded within the armies of the Empire. Although the Knights themselves are expert cavalrymen, the mounts that these Knights ride are what truly distinguishes them in the heat of battle."
 
 ####Southern Realms####
 estalian_swords:0 "Estalian Rodeleros"
 estalian_swords_flavor:0 "The rodeleros, are formations of lightly armed and highly mobile swordsmen, their mission is to infiltrate between the enemy lines and attack their flanks, as well as to protect the flanks of the pikemen units."
 estalian_hombres_villanos:0 "Estalian Hombres Villanos"
 estalian_hombres_villanos_flavor:0 "These are fierce and aggressive men of sword and shield from Estalia, recruited from among the numerous cutthroats, bandits and renegades that inhabit their realms. these Men carry hand weapons, and are clad in light armor and shields."
 tilean_spears:0 "Tilean Spearmen"
 tilean_spears_flavor:0 "Tilean mercenaries have a reputation for professionalism that other sell-swords do not."
 tilean_pikemen:0 "Tilean Pikemen"
 tilean_pikemen_flavor:0 "Mercenary Pikemen are often from Tilea where the Pike is the infantry weapon of choice."
 duelists:0 "Duelists"
 duelists_flavor:0 "A Duellist is a specialist in the lethal application of sword and pistol, hiring themselves out to safeguard the honour of others, though many of their kind come from the ranks of younger nobles who duel for their own purposes."
 morr_bodyguards:0 "Morr Bodyguards"
 morr_bodyguards_flavor:0 "The World is a dangerous place, and the best way to ensure anything's safety is to post a guard. From merchants' shipments to the emperor himself, anything worth taking care of is guarded."
 musketeers_merc:0 "Musketeers Company"
 musketeers_merc_flavor:0 "They are the projectile troops of the dogs of war armies, their function is to support the advance of the rest of the army and to diminish the enemy troops."
 crossbows_mercs:0 "Crossbowman Company"
 crossbows_mercs_flavor:0 "Mercenary Crossbowmen are professional missile troops, usually from the Border Princes, Estalia and Tilea."
 dragoons:0 "Dragoons"
 dragoons_flavor:0 "These troops inherited their clothing and tactics from the famous Arabian horsemen archers. They are agile troops that are used  to halt the enemy's advance."
 elf_mercs:0 "Mercenary Elves"
 elf_mercs_flavor:0 "Elves are a lithe and graceful race easily recognized by their pointed ears and hawkish features. They have a glorious yet tragic history and are renowned for their archery, learning, and wizardry."
 dwarf_mercs:0 "Mercenary Dwarfs"
 dwarf_mercs_flavor:0 "Dwarfs are famed for their love of gold, ale and adventure, young Dwarfs decide that they would rather earn their gold fighting than spend their life scraping the underground in search of rich ore. They are very much sought by mercenary armies."
 orc_mercs:0 "Mercenary Orcs"
 orc_mercs_flavor:0 "Orcs are the largest and strongest of the Greenskin races, the biggest members of which naturally dominate the others. Pecking order is established by constant fighting, so only the meanest and nastiest Orcs get to the very top of the tribal ladder."
 